[project]
name = "dlc-bridge"
version = "2.0.0"
description = "DLC SuperCharge bridge — Python runtime for the Kiro→Claude /dlc: hookchain"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Alex Michel", email = "alex.michel@equivant.com" }]
dependencies = [
    "filelock>=3.13.0",
]

[project.scripts]
dlc-bridge = "dlc_bridge.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dlc_bridge"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "unit: fast unit tests (default)",
    "integration: end-to-end tests with mocked claude",
    "parity: FR-19 v1.1 parity gate",
    "live: real claude API; skipped by default",
    "slow: > 1s runtime",
]
addopts = "-m 'not live' --strict-markers -ra"

[tool.coverage.run]
source = ["src/dlc_bridge"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.coverage.html]
directory = "htmlcov"
