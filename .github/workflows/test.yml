name: Test

# Cross-platform matrix CI for the DLC SuperCharge Python bridge (FR-22, NFR-7).
# Triggers on every PR and on pushes to main. All matrix legs must pass for a
# merge into main (enforced by branch protection — configured in Epic 5 WI-23).

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv (Astral)
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Sync dependencies
        run: uv sync --extra dev

      - name: Show Python + uv versions
        run: |
          uv --version
          uv run python --version

      - name: Unit + integration tests (with coverage)
        # Coverage gate is enforced by [tool.coverage.report] fail_under = 80
        # in pyproject.toml; --cov-fail-under=80 makes it explicit in CI logs.
        run: uv run pytest tests/unit tests/integration -v --cov=src/dlc_bridge --cov-report=xml --cov-report=term-missing --cov-fail-under=80

      - name: Parity tests
        # The parity suite includes cross-language (PowerShell) tests that
        # auto-skip when pwsh/powershell.exe is absent (macOS/Linux runners).
        # Python-only regression tests run on every leg.
        run: uv run pytest tests/parity -v -m parity

      - name: Upload coverage XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}-py${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: ignore
